<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2322c55e%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z%27/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HabitFlow – Daily Habit Tracker</title>
    <meta name="description" content="Track your daily habits, weekly progress and streaks." />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("habitflow:theme");
          var light = p === "light" || (p === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f5f5f5");
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HabitFlow" />
    <meta property="og:title" content="HabitFlow – Daily Habit Tracker" />
    <meta property="og:description" content="Track your daily habits, weekly progress and streaks." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
