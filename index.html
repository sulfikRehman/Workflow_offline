<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HabitFlow – Daily Habit Tracker</title>
    <meta name="description" content="Track your daily habits, weekly progress and streaks." />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("habitflow:theme");
          var light = p === "light" || (p === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
          // A photo is saved for this look: mark it now so the page does not flash before the photo is ready.
          try {
            var b = JSON.parse(localStorage.getItem("habitflow:backgrounds") || "null");
            if (b && b[light ? "light" : "dark"] && b[light ? "light" : "dark"].on === true) document.documentElement.setAttribute("data-bg", "on");
          } catch (e2) {}
          if (light) {
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4efe4");
            // Start loading the light-mode serif right away so the big numbers do not change shape after showing.
            var f = document.createElement("link");
            f.rel = "preload"; f.as = "font"; f.type = "font/woff2"; f.crossOrigin = "anonymous";
            f.href = "/fonts/fraunces-latin-600-normal.woff2";
            document.head.appendChild(f);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HabitFlow" />
    <meta property="og:title" content="HabitFlow – Daily Habit Tracker" />
    <meta property="og:description" content="Track your daily habits, weekly progress and streaks." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
